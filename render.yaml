services:
  - type: web
    name: unified-devops-backend
    env: node
    plan: free
    region: oregon
    buildCommand: npm install --include=dev && npm run build:server
    startCommand: npm run start:server
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: GITHUB_TOKEN
        sync: false
      - key: RENDER_API_KEY
        sync: false
      - key: CORS_ORIGIN
        sync: false
